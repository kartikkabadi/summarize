name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify package licenses and FFmpeg provenance
        run: pnpm licenses:check

      - name: Verify bundled relinking materials
        if: matrix.node == 24
        run: |
          packages/core/vendor/ffmpeg-wasm/node/source/rebuild.sh \
            --prepare-only \
            "${RUNNER_TEMP}/summarize-ffmpeg-relink"

      - name: Lint
        run: pnpm lint

      - name: Tests (coverage)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Pack
        run: |
          set -euo pipefail
          rm -rf _pack
          mkdir -p _pack/root _pack/core

          pnpm pack --pack-destination _pack/root
          pnpm -C packages/core pack --pack-destination "$PWD/_pack/core"

          echo "==> root"
          ls -la _pack/root
          ROOT_TARBALL="$(find _pack/root -maxdepth 1 -type f \( -name '*.tgz' -o -name '*.tar.gz' \) | head -1)"
          if [ -z "${ROOT_TARBALL:-}" ]; then
            echo "No root pack artifact found in _pack/root" >&2
            exit 1
          fi
          tar -tf "$ROOT_TARBALL" | grep -E '^package/dist/cli\.js$'
          tar -tf "$ROOT_TARBALL" | grep -E '^package/LICENSE$'
          tar -xOzf "$ROOT_TARBALL" package/package.json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              if (JSON.parse(input).license !== "MIT") process.exit(1);
            });
          '

          echo "==> core"
          ls -la _pack/core
          CORE_TARBALL="$(find _pack/core -maxdepth 1 -type f \( -name '*.tgz' -o -name '*.tar.gz' \) | head -1)"
          if [ -z "${CORE_TARBALL:-}" ]; then
            echo "No core pack artifact found in _pack/core" >&2
            exit 1
          fi
          tar -tf "$CORE_TARBALL" > _pack/core-members.txt
          for member in \
            package/dist/esm/index.js \
            package/dist/esm/content/index.js \
            package/dist/esm/prompts/index.js \
            package/dist/ffmpeg-wasm/node/ffmpeg_g.wasm \
            package/dist/ffmpeg-wasm/node/ffprobe_g.wasm \
            package/LICENSE \
            package/THIRD_PARTY_NOTICES.md \
            package/dist/ffmpeg-wasm/node/COPYING.LGPLv2.1 \
            package/dist/ffmpeg-wasm/node/COPYING.LAME \
            package/dist/ffmpeg-wasm/node/LICENSE.LAME.md \
            package/dist/ffmpeg-wasm/node/SOURCE.json \
            package/dist/ffmpeg-wasm/node/source/RELINKING.md \
            package/dist/ffmpeg-wasm/node/source/PATCHES.md \
            package/dist/ffmpeg-wasm/node/source/rebuild.sh \
            package/dist/ffmpeg-wasm/node/source/SHA256SUMS \
            package/dist/ffmpeg-wasm/node/source/offline-source.patch \
            package/dist/ffmpeg-wasm/node/source/build-19d425b80db2bfe2621f653de65599494aed4072.tar.gz \
            package/dist/ffmpeg-wasm/node/source/ffmpeg-239f2c733de417201d7ad3b3b8b0d9b63285b2b1.tar.gz \
            package/dist/ffmpeg-wasm/node/source/lame-2badea1974ae36cb8312afe99cff1e6b3b5decee.tar.gz; do
            grep -Fxq "$member" _pack/core-members.txt
          done
          tar -xOzf "$CORE_TARBALL" package/package.json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              if (JSON.parse(input).license !== "MIT") process.exit(1);
            });
          '

  extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (Chromium)
        run: pnpm -C apps/chrome-extension exec playwright install --with-deps chromium

      - name: Build extension
        run: pnpm -C apps/chrome-extension build

      - name: Extension E2E (Chromium)
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24' \
            pnpm -C apps/chrome-extension exec playwright test -c playwright.config.ts --project=chromium tests/native-messaging.e2e.spec.ts
          SUMMARIZE_E2E_HTTP_TRANSPORT=1 pnpm -C apps/chrome-extension build
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24' \
            env SUMMARIZE_E2E_HTTP_TRANSPORT=1 pnpm -C apps/chrome-extension exec playwright test -c playwright.config.ts --project=chromium

  extension-firefox-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Firefox
        run: pnpm -C apps/chrome-extension exec playwright install --with-deps firefox

      - name: Firefox extension smoke
        run: pnpm -C apps/chrome-extension test:firefox
